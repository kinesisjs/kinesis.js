name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default: CI only reads the repo. The release workflow is the
# only place that needs write / id-token scopes.
permissions:
  contents: read

jobs:
  ci:
    name: Lint, Typecheck, Test, Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test -- --reporter=verbose

      - name: Build
        run: pnpm build

      - name: Bundle size check
        run: pnpm size

  engines:
    name: Install on minimum Node
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      # Pinned to the exact floor from engines.node, not a range. .npmrc sets
      # engine-strict, so a dependency demanding something newer makes
      # `pnpm install` fail outright for everyone on the supported minimum. The
      # other jobs run `node-version: 22`, which setup-node resolves to the
      # newest 22.x and which therefore hides exactly that. Two bumps slipped
      # through this way: lint-staged@17 (node >=22.22.1) broke local installs,
      # and maplibre-gl pulls @mapbox/jsonlint-lines-primitives (node >=22),
      # which had quietly invalidated the old ">=20" claim. The floor is the
      # intersection of every dependency's engines field -- jsdom@29 narrows it
      # further to ^22.13.0 inside the 22.x line.
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.13.0

      - name: Install on the declared minimum
        run: pnpm install --frozen-lockfile

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # Audit only production dependencies at high/critical severity. Dev-only
      # advisories are handled by Dependabot PRs, not by blocking every build.
      # Reads pnpm-lock.yaml directly — no install needed.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high
