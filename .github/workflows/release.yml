name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write # for npm provenance + Trusted Publishing OIDC

jobs:
  release:
    name: Version or Publish
    if: github.repository == 'kinesisjs/kinesis.js'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Setup Node.js
        # `registry-url` is intentionally NOT set. With it, actions/setup-node
        # writes `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` into
        # ~/.npmrc. Under Trusted Publishing we don't set NODE_AUTH_TOKEN, and
        # an empty token line can mask the OIDC flow on some npm versions.
        # The registry default is registry.npmjs.org anyway, so omitting this
        # is purely defensive.
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Pin tool-cache npm to 11.x (Trusted Publishing floor, pre-npm-12 ceiling)
        # Node 22.x ships with npm 10.x. npm's automatic OIDC Trusted
        # Publishing flow landed in npm 11.5 — older npm CLIs see the
        # ACTIONS_ID_TOKEN_REQUEST_* env vars and ignore them, and every
        # publish fails with ENEEDAUTH (or, when wrapped by changesets/action,
        # surfaces as an opaque 404). So we need npm >=11.5.
        #
        # But we must NOT use npm@latest: `changeset publish` runs
        # `pnpm publish --no-git-checks`, and pnpm 9 delegates the actual
        # publish to the npm CLI, forwarding `--git-checks`. npm 12 turned
        # unknown CLI flags into a fatal EUNKNOWNCONFIG (was a warning through
        # v11), so every package fails to publish under npm@latest (=12.x).
        # See pnpm/pnpm#9646; the pnpm-side fix (#10077) isn't in our pinned
        # pnpm 9.15.9 yet. `npm@11` gives us the TP floor without the v12
        # ceiling. Revisit (back to @latest) once pnpm is upgraded past the fix.
        #
        # We deliberately avoid `sudo`: sudo strips PATH and the install
        # lands in /usr/local/lib/node_modules, leaving the tool-cache npm
        # (the one `which npm` resolves to) at 10.x. Plain `npm install -g`
        # writes into setup-node's tool cache, which is owned by the runner
        # user and is what every downstream step actually invokes.
        run: |
          npm install -g npm@11
          echo "npm: $(npm --version)"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure git author for release tags
        # Sets the identity used for git tags created by `changeset publish`.
        # NOTE: this does NOT control the author of the "Version Packages"
        # commit — changesets/action runs its own `git config user.name
        # github-actions[bot]` internally and overrides this. To keep the bot
        # off the Contributors list, merge the "Version Packages" PR with
        # "Squash and merge" (the squashed commit is authored by the merger,
        # not the bot).
        run: |
          git config user.name "Muzaffer AŞKAR"
          git config user.email "muh.muzafferaskar@gmail.com"

      - name: Build
        run: pnpm build

      - name: Create release PR or publish
        # Pinned to v1.9.0 deliberately. The action's major is coupled to the
        # Changesets CLI major: v2.0.0+ requires CLI v3 and fails outright on
        # CLI v2 ("Changesets CLI v2 is not supported"), and it also renamed
        # every input (version -> version-script, publish -> publish-script,
        # commit -> commit-message, title -> pr-title, createGithubReleases ->
        # create-github-releases). This repo is on @changesets/cli ^2.31.0, so
        # moving the action requires upgrading the CLI in the same change.
        # Dependabot shipped the v2 SHA under a stale "# v1" comment once (#41)
        # and took the release pipeline down; majors are now ignored for this
        # action in dependabot.yml.
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: pnpm changeset:version
          publish: pnpm changeset:publish
          commit: 'chore(release): version packages'
          title: 'chore(release): version packages'
          # Create one GitHub release per published package version, with body
          # auto-filled from that package's CHANGELOG.md entry. Per-package
          # releases give npm consumers a click-through "release notes" link
          # straight from each @kinesisjs/<pkg>@x.y.z npm page. Umbrella vX.Y.Z
          # tags + releases (curated highlights) are still created by hand on
          # release days where we want a human summary across packages.
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No NPM_TOKEN — Trusted Publishing on npm (per-package, see
          # documents/design/release-runbook.md §9) + `id-token: write` above
          # mints a short-lived OIDC token at publish time.
          NPM_CONFIG_PROVENANCE: true
